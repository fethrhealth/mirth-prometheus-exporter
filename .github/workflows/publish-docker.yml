name: Publish docker

# Mirrors orchestration-engine's release-docker.yml conventions (push publishes,
# pull_request builds without pushing, ghcr.io/fethrhealth/<name> naming,
# packages: write for GITHUB_TOKEN-based ghcr auth) — but through the standard
# docker/build-push-action rather than orchestration-engine's own
# fethrhealth/kestra-actions reusable workflows, which are Kestra-specific and
# do not apply here. Publishing ghcr.io/fethrhealth/mirth-exporter from here
# is also what interoperability-stack's QA compose file (MIRTH_EXPORTER_TAG)
# has been waiting on — it builds locally from a sibling checkout for dev, but
# the QA host has none, so it needs a real published image.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # ghcr.io push via GITHUB_TOKEN

env:
  IMAGE: ghcr.io/fethrhealth/mirth-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag is the exporter's own artifact version, so an image and
      # the mirth_exporter.py inside it carry the same number. It is read from
      # the module rather than restated here, where it would drift the first
      # time __version__ changes. Parsed, not imported: the runner has none of
      # the exporter's dependencies installed.
      #
      # The version alone does not say which build produced the image: every
      # push to main while `__version__` is unchanged would republish that
      # tag over the previous build. The Actions run number is appended below
      # so each build keeps a tag of its own.
      - name: Read the exporter version
        id: version
        run: |
          version="$(python3 -c "import ast, pathlib; module = ast.parse(pathlib.Path('mirth_exporter.py').read_text()); print(next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', None) == '__version__' for t in n.targets)))")"
          if [ -z "$version" ]; then
            echo "could not read __version__ from mirth_exporter.py" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # One tag, `<version>-<run number>`: the version says what is
          # inside the image, the Actions run number says which build
          # produced it, and that run records the commit it checked out, so
          # the image leads back to a sha. Run number, not run id, because
          # that is the number the Actions UI shows against the run.
          #
          # It is the only tag published. The moving tags this workflow used
          # to write — the bare version, `sha-<commit>`, the branch name and
          # `latest` — are gone, so nothing can pull a tag that silently
          # points at a different build than it did yesterday. Anything that
          # referred to one, interoperability-stack's QA compose file
          # (MIRTH_EXPORTER_TAG) included, now names a build explicitly.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ github.run_number }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          # A pull_request run still builds the image (catches a broken
          # Dockerfile before merge) but never pushes — the docker/login-action
          # step above is skipped for pull_request, so an unauthenticated push
          # would just fail regardless.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
