global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Forked Mirth exporter. Inside the Fethr compose network use the service name;
  # from the host use host.docker.internal:9001.
  - job_name: "mirth"
    static_configs:
      - targets: ["mirth-exporter:9001"]

  # Kestra orchestrator management port. /prometheus is unauthenticated on 8081.
  - job_name: "kestra"
    metrics_path: /prometheus
    static_configs:
      - targets: ["orchestrator:8081"]
